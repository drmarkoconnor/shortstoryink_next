name: Projects reproducible test bundle
on:
  pull_request:
    paths:
      - 'lib/projects/**'
      - 'components/projects/**'
      - 'tests/writer-projects.test.ts'
      - '.github/workflows/projects-reproducible-tests.yml'
permissions:
  contents: read
concurrency:
  group: projects-test-bundle-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  bundle:
    if: github.head_ref == 'v1.3-writer-projects'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack source and public runtime dependencies for offline verification
        run: |
          git archive --format=tar.gz --output="$RUNNER_TEMP/project-source.tgz" HEAD
          tar -czf "$RUNNER_TEMP/project-runtime.tgz" node_modules
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
      - uses: actions/upload-artifact@v4
        with:
          name: writer-projects-test-bundle
          path: |
            ${{ runner.temp }}/project-source.tgz
            ${{ runner.temp }}/project-runtime.tgz
            ${{ runner.temp }}/npm-audit.json
          retention-days: 1
          compression-level: 0
