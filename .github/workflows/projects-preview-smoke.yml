name: Writer projects deployed preview check

on:
  pull_request:
    paths:
      - 'lib/projects/**'
      - 'components/projects/**'
      - 'components/layout/**'
      - 'app/**'
      - 'netlify.toml'
      - '.github/workflows/projects-preview-smoke.yml'

permissions:
  contents: read
  statuses: read

concurrency:
  group: writer-projects-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deployed-preview:
    if: github.repository == 'drmarkoconnor/shortstoryink_next' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the actual deployed feature gate and guest routes without accounts or mail
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { appendFileSync } from 'node:fs'
          import { setTimeout as sleep } from 'node:timers/promises'

          const { GH_TOKEN, REPOSITORY, EXPECTED_SHA, PREVIEW_NUMBER } = process.env
          assert.equal(REPOSITORY, 'drmarkoconnor/shortstoryink_next')
          assert.match(EXPECTED_SHA, /^[a-f0-9]{40}$/)
          assert.match(PREVIEW_NUMBER, /^[1-9][0-9]*$/)
          // The destination is fixed to this site's PR preview, never an arbitrary PR-supplied URL.
          const base = `https://deploy-preview-${PREVIEW_NUMBER}--storyink.netlify.app`
          const statusUrl = `https://api.github.com/repos/${REPOSITORY}/commits/${EXPECTED_SHA}/status`
          let deployed = false
          for (let attempt = 0; attempt < 55; attempt++) {
            const response = await fetch(statusUrl, {
              headers: { Authorization: `Bearer ${GH_TOKEN}`, Accept: 'application/vnd.github+json' },
              signal: AbortSignal.timeout(20000),
            })
            assert.equal(response.status, 200, 'Unable to read this commit\'s deployment status')
            const status = await response.json()
            const preview = status.statuses?.find(item => item.context === 'netlify/storyink/deploy-preview')
            if (preview?.state === 'success') { deployed = true; break }
            if (preview?.state === 'failure' || preview?.state === 'error') {
              throw new Error('Netlify failed to deploy this exact commit; runtime checks cannot pass.')
            }
            if (attempt % 6 === 0) console.log(`Waiting for Netlify preview of ${EXPECTED_SHA}...`)
            await sleep(10000)
          }
          assert.ok(deployed, 'Timed out waiting for this exact preview commit')

          // Deliberately no auth token, session cookie, real user, database write or email.
          // projectContext returns before opening a database when there is no session.
          // 401 proves the feature is enabled at FUNCTION RUNTIME; 404 means it is disabled.
          let apiStatus = null
          for (let attempt = 0; attempt < 6; attempt++) {
            const response = await fetch(`${base}/api/writer/projects?deployment_check=${EXPECTED_SHA}`, {
              redirect: 'manual', headers: { 'Cache-Control': 'no-cache' }, signal: AbortSignal.timeout(20000),
            })
            apiStatus = response.status
            console.log(`Deployed Projects API without a session: HTTP ${apiStatus}`)
            if (apiStatus === 401) {
              assert.match(response.headers.get('content-type') ?? '', /application\/json/)
              const body = await response.json()
              assert.match(body.error ?? '', /sign in/i, 'Expected the protected Projects API, not a host access gate')
              break
            }
            await response.arrayBuffer()
            await sleep(5000)
          }
          assert.equal(apiStatus, 401, 'Projects is not available at runtime. Set WRITER_PROJECTS_ENABLED=true for deploy-preview Functions and redeploy; do not enable production.')

          const page = await fetch(`${base}/app/writer/projects`, {
            redirect: 'manual', headers: { 'Cache-Control': 'no-cache' }, signal: AbortSignal.timeout(20000),
          })
          assert.ok([302, 303, 307, 308].includes(page.status), `Projects page should send a guest to sign-in, not HTTP ${page.status}`)
          const destination = new URL(page.headers.get('location') ?? '', base)
          assert.equal(destination.origin, base, 'Sign-in must stay on this preview')
          assert.equal(destination.pathname, '/auth/sign-in')
          await page.arrayBuffer()
          const signIn = await fetch(destination, { redirect: 'manual', signal: AbortSignal.timeout(20000) })
          assert.equal(signIn.status, 200, 'Preview sign-in page is unavailable')
          await signIn.arrayBuffer()

          const summary = [
            '## Deployed Projects preview check',
            `Commit: ${EXPECTED_SHA}`,
            `Preview: ${base}`,
            '- Projects API: HTTP 401 (feature enabled; authentication still required).',
            '- Projects page: redirects a guest to sign-in on the same preview.',
            '- Sign-in page: HTTP 200.',
            '- No user accounts, manuscript data, database writes or emails used.',
            '',
            'This verifies deployed runtime configuration and guest routing. It is NOT an authenticated writer save/export rehearsal or a backup-restoration test.',
            '',
          ].join('\n')
          console.log(summary)
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary)
          NODE
