[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

[db.migrations]
  path = "netlify/database/migrations"

# Do not let a preview apply a new migration before its regression tests pass.
[context.deploy-preview]
  command = "npm test && npm run build"
